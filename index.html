<style>

html,body{overflow-x:hidden;max-width:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg) center/cover fixed;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.btn{border:0;border-radius:6px;padding:.7rem 1.3rem;font-weight:600;background:var(--wine);color:#fff}.btn.ghost{background:none;color:inherit;border:1.5px solid currentColor}
.logo{font-weight:800;font-size:1.3rem;color:var(--wine)}.logo img{display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(135deg,var(--bar),var(--wine))}
.card{background:#fff;color:#141012;width:100%;max-width:400px;border-radius:10px;padding:2rem 1.7rem}
.card h1{margin:.5rem 0 1rem;font-size:1.5rem}.card label{display:block;font-size:.85rem;color:var(--mute);margin:.9rem 0 .3rem}

.err{color:#c0182f;font-size:.85rem;min-height:1.2rem;margin-top:.6rem}

nav input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;padding:.45rem .7rem;width:min(180px,40vw)}

main{padding-bottom:3rem;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.rowt{margin:0;padding:1.8rem 4% .7rem;font-size:1.1rem}
.rail{display:flex;gap:.7rem;overflow-x:auto;padding:.2rem 4% .8rem}
.tile{flex:0 0 auto;width:min(200px,42vw);aspect-ratio:2/3;border-radius:8px;border:0;color:#fff;text-align:left;padding:.9rem;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.tile small{opacity:.85}.empty{padding:2rem 4%;color:var(--mute)}
.mod{position:fixed;inset:0;background:rgba(14,11,12,.75);display:grid;place-items:center;z-index:20;padding:1rem}
.mbox{background:#fff;color:#141012;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:10px}
.mart{aspect-ratio:16/8;display:flex;align-items:flex-end;padding:1.2rem;color:#fff;position:relative;background-size:cover;background-position:center}
.mart h3{margin:0;font-size:1.7rem}.x{position:absolute;top:.6rem;right:.6rem;background:rgba(0,0,0,.6);border:0;color:#fff;width:34px;height:34px;border-radius:50%}
.mbody{padding:1.2rem}.mbody p{line-height:1.6}.acts{display:flex;gap:.6rem;flex-wrap:wrap}.acts .ghost{color:var(--wine)}
.player{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:flex;flex-direction:column}
.player video,.player iframe{flex:1;width:100%;min-height:0;border:0}.player .nov{flex:1;display:grid;place-items:center;padding:1.5rem;text-align:center}.player .btn{margin:1rem auto}
#adm{background:#faf6f7;color:#141012;min-height:100vh}
#adm .btn{border:0;border-radius:6px;padding:.6rem 1.1rem;font-weight:600;background:var(--wine);color:#fff}
#adm .btn.ghost{background:none;color:var(--wine);border:1.5px solid var(--wine)}
#adm .btn.del{background:#c0182f}

#adm input[type=color]{padding:.15rem;height:42px}
#adm input[type=checkbox],#adm input[type=radio]{width:auto}
#adm label{display:block;font-size:.85rem;color:var(--mute);margin:.7rem 0 .25rem}
#adm .chk{display:flex;gap:.5rem;align-items:center}
#adm header{background:var(--bar);color:#fff;padding:.8rem 4%;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
#adm header b{color:#fff;flex:1}
#adm header .tabs{display:flex;gap:1rem}
#adm header .tabs button{background:none;border:0;color:#cdbfc4;padding:.3rem 0;border-bottom:2px solid transparent}
#adm header .tabs .on{color:#fff;border-color:var(--wine)}
#adm header .btn.ghost{color:#fff;border-color:#fff}
#adm main{padding:1.2rem 4% 3rem;max-width:960px;margin:auto}
#adm .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1.2rem}
#adm .panel h3{margin:0 0 .4rem}
#adm .acts{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
#adm .scroll{overflow-x:auto}
#adm table{width:100%;border-collapse:collapse;font-size:.92rem}
#adm th,#adm td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
#adm td .btn{padding:.35rem .7rem;font-size:.85rem}
#adm td input{min-width:90px}
#adm .ok{color:#1b7a3b;font-size:.9rem;min-height:1.2rem;margin-top:.5rem}
.tile{position:relative;overflow:hidden}.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--wine)}
</style></head>

<script>
const SUPABASE_URL="https://xzeahvkmvrdpxcfsgwqh.supabase.co",SUPABASE_KEY="sb_publishable_LCRngOPZzgc6E-QwT6jjZQ_hb0qqLjY";
const GOOGLE_LOGIN=true; // set to false to hide the "Continue with Google" button
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let S={set:{},user:null,sub:null,view:"home",q:"",mode:"in",T:[],R:[],L:[],H:[],isAdmin:false,preview:false};window.__ROOT=S;

 r.setProperty("--wine",d.accent||"#9b2c4b");r.setProperty("--bar",d.dark||"#0e0b0c");r.setProperty("--bg",d.bg||"#ffffff");

async function picker(){
 const {data}=await sb.from("sub_profiles").select("*").order("id"),l=data||[];
 app.innerHTML=`<div class="profiles"><h1>Who's watching?</h1><div class="plist">${l.map(p=>`<button class="prof" data-i="${p.id}"><div class="av">${esc(p.name[0].toUpperCase())}</div>${esc(p.name)}</button>`).join("")}${l.length<5?`<button class="prof" id="add"><div class="av add">+</div>Add profile</button>`:""}</div><button class="btn ghost" id="out">Sign out</button></div>`;
 document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.sub=l.find(p=>p.id==b.dataset.i);S.view="home";S.q="";browse()});

 $("#out").onclick=out}
async function browse(){
 const [r,t,m,h]=await Promise.all([sb.from("rows").select("*").order("position"),sb.from("titles").select("*").order("id"),sb.from("my_list").select("title_id").eq("sub_id",S.sub.id),sb.from("watch_history").select("*").eq("sub_id",S.sub.id)]);
 S.R=r.data||[];S.T=t.data||[];S.L=(m.data||[]).map(x=>x.title_id);S.H=h.data||[];draw()}
const art=t=>t.poster_url?`linear-gradient(transparent 45%,rgba(0,0,0,.85)),url("${esc(t.poster_url)}")`:`linear-gradient(160deg,hsl(${(t.id*37)%40+330} 55% 30%),hsl(${(t.id*37)%40+330} 60% 14%))`;
const bar=t=>{const h=S.H.find(x=>x.title_id==t.id);return h&&h.duration>0&&h.position>5?`<i class="bar" style="width:${Math.min(100,Math.round(h.position/h.duration*100))}%"></i>`:""};
const hist=()=>[...S.H].sort((a,b)=>new Date(b.watched_at)-new Date(a.watched_at)).map(x=>S.T.find(t=>t.id==x.title_id)).filter(Boolean);
const tile=t=>`<button class="tile" data-id="${t.id}" style="background-image:${art(t)}"><b>${esc(t.title)}</b><small>${esc([t.year,t.genre].filter(Boolean).join(" · "))}</small>${bar(t)}</button>`;
const rail=(n,a)=>a.length?`<h3 class="rowt">${esc(n)}</h3><div class="rail">${a.map(tile).join("")}</div>`:"";
function draw(){
 app.innerHTML=`<nav>${brand()}<div class="tabs"><button data-v="home" class="${S.view=="home"?"on":""}">Home</button><button data-v="list" class="${S.view=="list"?"on":""}">My list (${S.L.length})</button><button data-v="history" class="${S.view=="history"?"on":""}">Watched</button></div>
 <input id="q" type="search" placeholder="Search titles" aria-label="Search titles" value="${esc(S.q)}"><button class="btn ghost" id="sw" style="padding:.4rem .8rem">${esc(S.sub.name)}</button>${S.isAdmin?`<button class="btn ghost" id="toadm" style="padding:.4rem .8rem">Admin panel</button>`:""}<button class="btn ghost" id="out" style="padding:.4rem .8rem">Sign out</button></nav><div id="body"></div>`;
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.q="";draw()});
 $("#sw").onclick=()=>{S.sub=null;picker()};$("#out").onclick=out;const ta=$("#toadm");if(ta)ta.onclick=()=>{S.preview=false;S.sub=null;go()};$("#q").oninput=e=>{S.q=e.target.value;body()};body()}
function body(){
 const q=S.q.trim().toLowerCase();let h="";
 if(q){const r=S.T.filter(t=>(t.title+" "+(t.genre||"")).toLowerCase().includes(q));h=r.length?rail("Results",r):`<p class="empty">No titles match “${esc(S.q)}”. Try a genre.</p>`}
 else if(S.view=="history"){const r=hist();h=r.length?rail("Watched",r):`<p class="empty">Titles you play will appear here.</p>`}
 else if(S.view=="list"){const r=S.T.filter(t=>S.L.includes(t.id));h=r.length?rail("My list",r):`<p class="empty">Your list is empty. Open a title and select Add to list.</p>`}
 else{const f=S.T.find(t=>t.featured)||S.T[0];
  if(f)h+=`<section class="hero" style="background-image:linear-gradient(100deg,var(--bar) 5%,transparent 90%),${f.poster_url?`url('${esc(f.poster_url)}'),`:""}linear-gradient(100deg,var(--bar),var(--wine))"><h2>${esc(f.title)}</h2><p>${esc(f.description)}</p><div class="b"><button class="btn" data-play="${f.id}">Play</button><button class="btn ghost" data-id="${f.id}">More info</button></div></section>`;
  h+=rail("Continue watching",hist().filter(t=>{const x=S.H.find(y=>y.title_id==t.id);return x.position>5}));
  h+=S.R.map(r=>rail(r.name,S.T.filter(t=>t.row_id==r.id))).join("");
  const loose=S.T.filter(t=>!t.row_id);h+=rail("More to watch",loose);
  if(!S.T.length)h+=`<p class="empty">No films yet. Add some in the admin panel.</p>`}
 $("#body").innerHTML="<main>"+h+"</main>";
 document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>detail(+b.dataset.id));

function detail(id){
 const t=S.T.find(x=>x.id==id),has=S.L.includes(id),m=document.createElement("div");
 m.className="mod";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");

 document.body.appendChild(m);const close=()=>m.remove();
 m.onclick=e=>{if(e.target===m)close()};m.querySelector(".x").onclick=close;m.querySelector(".x").focus();
 m.querySelector("#pl").onclick=()=>{close();play(id)};
 m.querySelector("#ls").onclick=async()=>{
  if(has)await sb.from("my_list").delete().eq("sub_id",S.sub.id).eq("title_id",id);else await sb.from("my_list").insert({sub_id:S.sub.id,title_id:id});

/* Google Drive / YouTube / Vimeo links play in an embedded player; anything else plays in the normal video player */
function embedFor(url){
 const u=(url||"").trim();let m;
 if((m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/)))return{iframe:`https://drive.google.com/file/d/${m[1]}/preview`};
 if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/)))return{iframe:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1`};
 if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return{iframe:`https://player.vimeo.com/video/${m[1]}?autoplay=1`};
 return{video:u}}
async function mark(t,pos,dur){
 if(!S.sub)return;
 const row={sub_id:S.sub.id,title_id:t.id,watched_at:new Date().toISOString()};
 if(pos!=null&&dur>0){row.position=pos>dur-15?0:Math.floor(pos);row.duration=Math.floor(dur)}
 const h=S.H.find(x=>x.title_id==t.id);h?Object.assign(h,row):S.H.unshift({position:0,duration:0,...row});
 await sb.from("watch_history").upsert(row,{onConflict:"sub_id,title_id"})}
function play(id){
 const t=S.T.find(x=>x.id==id),p=document.createElement("div");p.className="player";
 const e=t.video_url?embedFor(t.video_url):null,h=S.H.find(x=>x.title_id==id);
 p.innerHTML=(e?(e.iframe?`<iframe src="${esc(e.iframe)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(t.title)}"></iframe>`:`<video controls autoplay playsinline src="${esc(e.video)}"></video>`):`<div class="nov"><div><h3>${esc(t.title)}</h3><p>No video has been added for this title yet.</p></div></div>`)+`<button class="btn ghost" id="cl" style="color:#fff">Close player</button>`;
 document.body.appendChild(p);

 if(t.video_url)mark(t);                       // log that this title was watched (embedded players can't report progress)
 if(v){let last=0;
  v.onloadedmetadata=()=>{if(h&&h.position>5&&h.position<v.duration-15)v.currentTime=h.position};   // resume where they stopped
  v.ontimeupdate=()=>{if(Date.now()-last>15000){last=Date.now();mark(t,v.currentTime,v.duration)}};

const ADMIN=(()=>{const ROOT=window.__ROOT;

 S.R=r.data||[];S.T=t.data||[];S.U=u.data||[];S.set=s.data?.data||{};S.AE=ae.data||[];const own={};(sp.data||[]).forEach(x=>own[x.id]=x.user_id);S.W={};(wh.data||[]).forEach(x=>{const k=own[x.sub_id];if(k)S.W[k]=(S.W[k]||0)+1});shell()}

 <div style="font-size:.82rem;color:var(--mute)">Google Drive: open the file, click Share, set General access to "Anyone with the link", then paste the link. Uploads are limited by your Supabase plan's per-file size; use a link for full-length films.</div>
 <label>Row<select name="row_id"><option value="">None</option>${opts}</select></label>
 <label class="chk"><input type="checkbox" name="featured" ${e.featured?"checked":""}> Show as the featured title on Home</label>
 <div class="acts"><button class="btn">${e.id?"Save changes":"Add film"}</button>${e.id?`<button type="button" class="btn ghost" id="cancel">Cancel</button>`:""}</div>${note()}</form>
 <div class="panel scroll"><h3>All films (${S.T.length})</h3><table><tr><th>Title</th><th>Row</th><th></th></tr>${S.T.map(t=>`<tr><td>${esc(t.title)}${t.featured?" ★":""}</td><td>${esc(S.R.find(r=>r.id==t.row_id)?.name||"—")}</td><td><button class="btn ghost" data-edit="${t.id}">Edit</button> <button class="btn del" data-del="${t.id}">Delete</button></td></tr>`).join("")}</table></div>`}
function rows(){
 return `<div class="panel scroll"><h3>Rows on Home</h3><p style="color:var(--mute);margin:0 0 .6rem">Lower numbers appear higher on the page.</p><table><tr><th>Name</th><th>Order</th><th></th></tr>
 ${S.R.map(r=>`<tr><td><input data-rn="${r.id}" value="${esc(r.name)}" aria-label="Row name"></td><td><input data-rp="${r.id}" type="number" value="${r.position}" aria-label="Order" style="width:80px"></td><td><button class="btn" data-saverow="${r.id}">Save</button> <button class="btn del" data-delrow="${r.id}">Delete</button></td></tr>`).join("")}</table>
 <div class="acts"><input id="newrow" placeholder="New row name" style="max-width:260px"><button class="btn" id="addrow">Add row</button></div>${note()}</div>`}
function look(){
 const d=S.set,c=(k,l)=>`<label>${l}<input type="color" name="${k}" value="${esc(d[k]||"#ffffff")}"></label>`,t=(k,l)=>`<label>${l}<input name="${k}" value="${esc(d[k])}"></label>`;
 return `<form id="lf" class="panel"><h3>Look & feel</h3>${t("brand","Brand name")}${t("logo","Logo image URL (leave empty to show the name)")}${c("accent","Accent color (buttons, highlights)")}${c("dark","Top bar and profile screen color")}${c("bg","Page background color")}${t("bgImage","Page background image URL (optional, overrides color)")}<div class="acts"><button class="btn">Save look & feel</button></div>${note()}</form>`}
function users(){
 return `<div class="panel"><h3>Admin emails</h3><p style="color:var(--mute);margin:0 0 .6rem">Anyone who signs in with one of these emails opens the admin panel.</p>${S.AE.map(a=>`<div style="display:flex;gap:.6rem;align-items:center;padding:.3rem 0">${esc(a.email)}${a.email.toLowerCase()==(S.me.email||"").toLowerCase()?" (you)":` <button class="btn del" data-rmadm="${esc(a.email)}" style="padding:.25rem .6rem;font-size:.8rem">Remove</button>`}</div>`).join("")}<div class="acts"><input id="newadm" type="email" placeholder="email@example.com" aria-label="New admin email" style="max-width:280px"><button class="btn" id="addadm">Add admin</button></div></div><div class="panel scroll"><h3>Accounts (${S.U.length})</h3><table><tr><th>Email</th><th>Role</th><th>Blocked</th><th>Last active</th><th>Titles watched</th></tr>${S.U.map(u=>{const me=u.id==S.me.id;return `<tr><td>${esc(u.email)}${me?" (you)":""}</td><td><select data-role="${u.id}" ${me?"disabled":""} aria-label="Role"><option value="viewer" ${u.role=="viewer"?"selected":""}>Viewer</option><option value="admin" ${u.role=="admin"?"selected":""}>Admin</option></select></td><td><input type="checkbox" data-block="${u.id}" ${u.blocked?"checked":""} ${me?"disabled":""} aria-label="Blocked"></td><td>${u.last_seen?new Date(u.last_seen).toLocaleDateString():"—"}</td><td>${S.W[u.id]||0}</td></tr>`}).join("")}</table>${note()}</div>`}
async function upload(file,folder){
 const ext=(file.name.split(".").pop()||"bin").toLowerCase(),path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
 const {error}=await sb.storage.from("films").upload(path,file,{cacheControl:"3600",contentType:file.type});
 if(error)throw error;return sb.storage.from("films").getPublicUrl(path).data.publicUrl}
async function done(m){S.msg=m;await load()}
function bind(){
 const f=$("#f");
 if(f)f.onsubmit=async e=>{e.preventDefault();
  const btn=f.querySelector("button:not([type=button])"),ok=$(".ok"),v=Object.fromEntries(new FormData(f));btn.disabled=true;let r;
  try{
   let video=(v.video_url||"").trim(),poster=(v.poster_url||"").trim();
   if(v.source==="upload"){
    if(!v.video_file||!v.video_file.size)throw new Error("Choose a video file to upload.");
    ok.textContent="Uploading the video. Keep this page open…";video=await upload(v.video_file,"videos")}
   else if(/drive\.google\.com\/drive\/folders/.test(video))throw new Error("That is a folder link. Open the film file itself, click Share and copy that link.");
   if(v.poster_file&&v.poster_file.size){ok.textContent="Uploading the poster…";poster=await upload(v.poster_file,"posters")}
   const row={title:v.title.trim(),year:v.year?+v.year:null,genre:v.genre||null,description:v.description||null,poster_url:poster||null,video_url:video||null,row_id:v.row_id?+v.row_id:null,featured:!!v.featured};
   if(row.featured)await sb.from("titles").update({featured:false}).eq("featured",true);
   r=S.edit?await sb.from("titles").update(row).eq("id",S.edit.id):await sb.from("titles").insert(row);
  }catch(err){ok.textContent=err.message||"Something went wrong.";btn.disabled=false;return}
  S.edit=null;done(r.error?r.error.message:"Saved.")};
 if(f)f.querySelectorAll("[name=source]").forEach(r=>r.onchange=()=>{const up=f.elements.source.value==="upload";$("#vl").style.display=up?"none":"";$("#vf").style.display=up?"":"none"});
 const c=$("#cancel");if(c)c.onclick=()=>{S.edit=null;shell()};
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{S.edit=S.T.find(t=>t.id==b.dataset.edit);shell();scrollTo(0,0)});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this film? This cannot be undone.")){
  const t=S.T.find(x=>x.id==b.dataset.del),paths=[t?.video_url,t?.poster_url].map(u=>(u||"").split("/object/public/films/")[1]).filter(Boolean).map(decodeURIComponent);
  if(paths.length)await sb.storage.from("films").remove(paths);
  await sb.from("titles").delete().eq("id",b.dataset.del);done("Film deleted.")}});
 const a=$("#addrow");if(a)a.onclick=async()=>{const n=$("#newrow").value.trim();if(!n)return;await sb.from("rows").insert({name:n,position:S.R.length+1});done("Row added.")};
 document.querySelectorAll("[data-saverow]").forEach(b=>b.onclick=async()=>{const id=b.dataset.saverow;await sb.from("rows").update({name:$(`[data-rn="${id}"]`).value.trim(),position:+$(`[data-rp="${id}"]`).value}).eq("id",id);done("Row saved.")});
 document.querySelectorAll("[data-delrow]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this row? Its films stay and move to More to watch.")){await sb.from("rows").delete().eq("id",b.dataset.delrow);done("Row deleted.")}});
 const lf=$("#lf");if(lf)lf.onsubmit=async e=>{e.preventDefault();const r=await sb.from("settings").update({data:Object.fromEntries(new FormData(lf))}).eq("id",1);done(r.error?r.error.message:"Saved. Reload the viewer app to see it.")};
 document.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{await sb.from("profiles").update({role:s.value}).eq("id",s.dataset.role);done("Role updated.")});
 document.querySelectorAll("[data-block]").forEach(s=>s.onchange=async()=>{await sb.from("profiles").update({blocked:s.checked}).eq("id",s.dataset.block);done(s.checked?"Account blocked.":"Account unblocked.")});
 const aa=$("#addadm");if(aa)aa.onclick=async()=>{const em=$("#newadm").value.trim().toLowerCase();if(!em)return;const r=await sb.from("admin_emails").insert({email:em});done(r.error?r.error.message:"Admin added.")};
 document.querySelectorAll("[data-rmadm]").forEach(b=>b.onclick=async()=>{if(confirm("Remove admin access for "+b.dataset.rmadm+"?")){await sb.from("admin_emails").delete().eq("email",b.dataset.rmadm);done("Admin removed.")}})}

function start(){S.me=ROOT.user;S.tab="films";S.edit=null;S.msg="";load()}
return{start}})();

init();
</script></body></html>
