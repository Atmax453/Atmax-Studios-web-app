/* Google Drive / YouTube / Vimeo links play in an embedded player; anything else plays in the normal video player */
function embedFor(url){
 const u=(url||"").trim();let m;
 if((m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/)))return{iframe:`https://drive.google.com/file/d/${m[1]}/preview`};
 if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/)))return{iframe:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1`};
 if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return{iframe:`https://player.vimeo.com/video/${m[1]}?autoplay=1`};
 return{video:u}}
async function mark(t,pos,dur){

 if(pos!=null&&dur>0){row.position=pos>dur-15?0:Math.floor(pos);row.duration=Math.floor(dur)}
 const h=S.H.find(x=>x.title_id==t.id);h?Object.assign(h,row):S.H.unshift({position:0,duration:0,...row});
 await sb.from("watch_history").upsert(row,{onConflict:"sub_id,title_id"})}

 document.addEventListener("keydown",e=>{
  const k=e.key,a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName),top=[...document.querySelectorAll(".player,.mod")].pop();
  if(k==="Escape"||(k==="Backspace"&&!typing)||e.keyCode===10009||e.keyCode===461||k==="GoBack"||k==="BrowserBack"){if(top){e.preventDefault();const c=top.querySelector("#cl,.x,#g3");c?c.click():top.remove()}return}
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];if(!d||(typing&&d[1]===0))return;
  const v=document.querySelector(".player video");if(v){e.preventDefault();if(d[0])v.currentTime+=d[0]*10;else $("#cl").focus();return}
  const els=[...(top||document).querySelectorAll(FQ)].filter(vis),from=els.includes(a)?a:null;

  const r=from.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  els.forEach(n=>{if(n===from)return;const q=n.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,main=d[0]?x*d[0]:y*d[1],cross=d[0]?Math.abs(y):Math.abs(x);if(main<=1)return;const s=main+cross*2.2;if(s<bs){bs=s;best=n}});
